<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bangkok Live Cameras</title>
    <style>
      :root {
        --bg: #0b0d12;
        --tile: #141821;
        --text: #e5e7eb;
        --muted: #8b93a3;
        --live: #22c55e;
        --wait: #eab308;
        --fail: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          'Noto Sans Thai',
          sans-serif;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: baseline;
        flex-wrap: wrap;
        padding: 12px 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      #summary,
      header a {
        color: var(--muted);
      }
      select {
        background: var(--tile);
        color: var(--text);
        border: 1px solid #2a3140;
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
      }
      #note {
        color: var(--muted);
        padding: 0 16px 8px;
        margin: 0;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .tile .near {
        display: block;
        color: #fbbf24;
        font-size: 12px;
      }
      #grid {
        display: grid;
        gap: 8px;
        padding: 0 16px 16px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      .tile {
        position: relative;
        background: var(--tile);
        border-radius: 6px;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        cursor: zoom-in;
      }
      .tile video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .tile .label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 18px 8px 6px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        font-size: 13px;
      }
      .tile .state {
        position: absolute;
        top: 6px;
        left: 6px;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.7);
      }
      .state.live {
        color: var(--live);
      }
      .state.wait {
        color: var(--wait);
      }
      .state.fail {
        color: var(--fail);
      }
      .tile.zoomed {
        position: fixed;
        inset: 16px;
        z-index: 10;
        aspect-ratio: auto;
        cursor: zoom-out;
      }
      .tile.zoomed video {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>กล้องสด กรุงเทพฯ</h1>
      <select id="mode" aria-label="เลือกกลุ่มกล้อง"></select>
      <span id="summary">กำลังโหลดรายชื่อกล้อง…</span>
      <a href="/bkk-news.html">ข่าวตามโซน</a>
      <a href="/">← กลับไปที่แผนที่</a>
    </header>
    <p id="note"></p>
    <main id="grid"></main>
    <script type="module" src="/src/bkkCams/wall.js"></script>
  </body>
</html>
