<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bangkok News by Zone</title>
    <style>
      :root {
        --bg: #0b0d12;
        --tile: #141821;
        --line: #2a3140;
        --text: #e5e7eb;
        --muted: #8b93a3;
        --flood: #38bdf8;
        --outage: #a855f7;
        --fire: #f43f5e;
        --traffic: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          'Noto Sans Thai',
          sans-serif;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      header a,
      #summary {
        color: var(--muted);
      }
      select {
        background: var(--tile);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
      }
      #zones {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 16px 12px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--tile);
        color: var(--text);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
        font: inherit;
      }
      .chip[aria-pressed='true'] {
        border-color: var(--flood);
        color: var(--flood);
      }
      #list {
        display: grid;
        gap: 12px;
        padding: 0 16px 16px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      .card {
        background: var(--tile);
        border-radius: 8px;
        overflow: hidden;
      }
      .player {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        cursor: pointer;
      }
      .player img,
      .player iframe {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 0;
        display: block;
      }
      .player .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 42px;
        color: #fff;
        text-shadow: 0 2px 8px #000;
      }
      .live {
        position: absolute;
        top: 6px;
        left: 6px;
        background: #dc2626;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
      }
      .body {
        padding: 8px 10px 10px;
      }
      .title {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 0 6px;
        border-radius: 4px;
        margin-right: 4px;
        border: 1px solid currentColor;
      }
      .tag.flood {
        color: var(--flood);
      }
      .tag.outage {
        color: var(--outage);
      }
      .tag.fire {
        color: var(--fire);
      }
      .tag.traffic {
        color: var(--traffic);
      }
      .place {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ข่าวตามโซน กรุงเทพฯ</h1>
      <select id="topic" aria-label="หัวข้อข่าว">
        <option value="">ทุกหัวข้อ</option>
        <option value="flood">น้ำท่วม</option>
        <option value="outage">ไฟดับ</option>
        <option value="fire">ไฟไหม้</option>
        <option value="traffic">จราจร/อุบัติเหตุ</option>
      </select>
      <span id="summary">กำลังโหลด…</span>
      <a href="/bkk-cams.html">กล้องสด</a>
      <a href="/">← แผนที่</a>
    </header>
    <nav id="zones" aria-label="โซน"></nav>
    <main id="list"></main>
    <script type="module" src="/src/bkkCams/news.js"></script>
  </body>
</html>
