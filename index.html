  <!-- bkk-watch: choose simple/advanced mode before first paint, and skip
       GEV's first-launch mission picker in simple mode. -->
  <script>
    (function () {
      var mode = 'simple';
      try { mode = localStorage.getItem('bkkwatch:mode') || 'simple'; } catch (e) {}
      if (mode !== 'advanced') {
        document.documentElement.classList.add('th-simple');
        // The preloader is drawn in the saved theme, before the app mounts.
        var theme = 'light';
        try { theme = localStorage.getItem('bkkwatch:theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
        document.documentElement.dataset.thTheme = theme;
        try { sessionStorage.setItem('gev:first-run-mission-session:v1', 'dismissed'); } catch (e) {}
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,view_in_ar" rel="stylesheet" />
